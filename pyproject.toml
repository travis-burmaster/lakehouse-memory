[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-memory"
version = "0.1.0b2"
description = "Unity Catalog-native episodic, semantic, and working memory for AI agents on Databricks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Travis Burmaster", email = "travis@burmaster.com" }]
keywords = ["databricks", "unity-catalog", "ai-agents", "memory", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
    "databricks-vectorsearch>=0.40",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "python-dotenv>=1.0",
    "build>=1.0",
    "twine>=5.0",
]
langchain = [
    "langchain-core>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/travis-burmaster/lakehouse-memory"
Issues = "https://github.com/travis-burmaster/lakehouse-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
